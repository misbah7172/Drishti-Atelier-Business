<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drishti Atelier — Architectural Luxury Eyewear</title>
    <script>
      // Single Page Apps fallback script for static file servers
      // If served as a 404 fallback, reload index.html while maintaining path in history
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (path && path !== '/404.html' && path !== '/404') {
          sessionStorage.setItem('spa_redirect', path + search + hash);
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
  </head>
  <body>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #0c0a09; color: #a8a29e;">
      <p style="letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.875rem;">Loading Drishti Atelier...</p>
    </div>
  </body>
</html>
